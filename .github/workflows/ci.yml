name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: ${{ matrix.os }} / Go ${{ matrix.go }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15]
        go: ['1.26.x', '1.27.x']
    defaults:
      run:
        shell: bash
    env:
      GOTOOLCHAIN: local
      GOWORK: off
      GOFLAGS: -mod=readonly
      GOPROXY: off
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Go
        uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version: ${{ matrix.go }}
          check-latest: true
          cache: false
      - name: Record environment
        run: |
          go version
          go env GOOS GOARCH
          uname -smr
          if [[ "$RUNNER_OS" == Linux ]]; then
            test "$(go env GOARCH)" = amd64
          fi
      - name: Require standard-library-only module
        run: |
          modules="$(go list -m all)"
          printf '%s\n' "$modules"
          test "$modules" = github.com/anaregdesign/tarp
      - name: Vet
        run: go vet ./...
      - name: Test
        run: go test -count=1 -timeout=5m ./...
      - name: Race test
        run: go test -race -count=1 -timeout=5m ./...
