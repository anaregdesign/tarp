#cloud-config
datasource_list: [NoCloud]
growpart:
  mode: "off"
resize_rootfs: false
package_update: false
package_upgrade: false
ssh_deletekeys: false
ssh_pwauth: false
runcmd:
  - [mkdir, -p, /mnt/tarp-input]
  - [mount, -t, 9p, -o, "trans=virtio,version=9p2000.L", tarpinput, /mnt/tarp-input]
  - [env, TARP_QUAL_GUEST_CONFIRM=disposable-vm-only, bash, /mnt/tarp-input/guest.sh]
